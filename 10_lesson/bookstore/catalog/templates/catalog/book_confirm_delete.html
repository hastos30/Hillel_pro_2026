{% extends "catalog/base.html" %}

{% block title %}Видалення книги | BookStore{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-7">

        <div class="card border-danger">
            <div class="card-body p-4">

                <h1 class="text-danger mb-4">
                    Видалення книги
                </h1>

                <p>
                    Ви впевнені, що хочете видалити книгу
                    <strong>«{{ object.title }}»</strong>?
                </p>

                <p class="text-muted">
                    Цю дію неможливо скасувати.
                </p>

                <form method="post">
                    {% csrf_token %}

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-danger">
                            Так, видалити
                        </button>

                        <a href="{% url 'catalog:book_detail' object.pk %}" class="btn btn-outline-secondary">
                            Скасувати
                        </a>
                    </div>
                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
